# Example nginx for Vite + React Router (makemystay.ai).
# Symptom you fixed: plain "404 Not Found" from nginx for / and for /sitemap.xml
# means either `root` pointed at the wrong folder, or `try_files` was missing for SPA.
#
# After `npm run build`, deploy the ENTIRE contents of `dist/` (includes index.html,
# assets/, sitemap.xml, robots.txt, logo.svg, manifest.json, etc.).
#
#   sudo ln -sf /path/to/makemystay/dist /var/www/makemystay
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name makemystay.ai www.makemystay.ai;

    # CHANGE: absolute path to your deployed `dist` folder
    root /var/www/makemystay;
    index index.html;

    # Optional: browsers request /favicon.ico even when HTML uses /logo.svg
    location = /favicon.ico {
        return 302 /logo.svg;
    }

    # Cache immutable hashed assets aggressively (Vite emits filenames with hash)
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA: serve real files first, then index.html for client-side routes (/pg/..., /properties/...)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Helpful for debugging: ensure these exist in `dist/` after build
    # (sitemap is written by `node scripts/generate-sitemap.mjs` at end of `npm run build`)
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
        default_type application/xml;
    }

    location = /robots.txt {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # ssl_certificate / ssl_certificate_key directives go here
}

server {
    listen 80;
    listen [::]:80;
    server_name makemystay.ai www.makemystay.ai;
    return 301 https://makemystay.ai$request_uri;
}
